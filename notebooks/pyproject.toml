[project]
name = "notebooks"
version = "0.1.0"
description = "Exploration notebooks for the wind power forecasting project"
requires-python = ">=3.13"
dependencies = [
  "altair>=6.2.2",
  "marimo>=0.24.0",
  "matplotlib>=3.11.1",
  "mlflow==3.15.2",
  "numpy==2.1.3",
  "optuna>=4.9.0",
  "pandas==2.2.3",
  "polars>=1.44.1",
  "scikit-learn==1.5.2",
  "scipy>=1.18.1",
  "seaborn>=0.13.2",
  "skops==0.13.0",
]

[tool.pyright]
reportMissingTypeStubs = false
